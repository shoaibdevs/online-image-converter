{% extends 'base/base.html' %}
{% block content %}
{% include 'base/breadcrumb.html' with title='Login' %}
<section id="contact" class="contact">

    <div class="container" data-aos="fade-up">
      <div class="section-title" data-aos="fade-up">
        <h2>Login</h2>
        <p>Sign in to access your account.</p>
    </div>
    
      <div class="row justify-content-center" data-aos="fade-up">
        
        <div class="col-lg-6">
          {% if error %}
          <div class="py-3" style="background-color: #ed3c0d;    margin-bottom: 4%;">
            <div class="login-error-message" style="color: #fff; text-align: center;">{{ error }}</div>

          </div>
            {% endif %}
          <form action="/login" method="post"  class="php-email-form">
            {% csrf_token %}
            
            <div class="form-group mt-3">
                <input type="text" class="form-control" name="email" id="email" placeholder="Your Email" required>
            </div>
            <div class="form-group mt-3">
                <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
              </div>
          
            <div class="text-center"><button type="submit">Login</button></div>
          </form>
        </div>

      </div>

    </div>
  </section>
{% endblock %}
